/* ---------- تحميل البيانات ---------- */
const DEFW=[{l:'3600',t:'p',v:3600},{l:'حظ أوفر',t:'x',v:0},{l:'200',t:'p',v:200},{l:'حظ أوفر',t:'x',v:0},{l:'500',t:'p',v:500},{l:'100',t:'p',v:100},{l:'جوهرة',t:'g',v:1},{l:'50',t:'p',v:50}];
async function load(){
  GX.t=Date.now();
  const c=await api('/cfg');
  if(c&&!c.error){GX.cfg=c;GX.off=0}else GX.off=1;
  const a=acct();
  if(a&&!isDemo()){const m=await api('/me?'+qs(a));if(m&&!m.error)GX.me=m}
  if(S.r=='fun'&&!GX.spin&&!anyOpen())draw();
}

/* ---------- الواجهة: التسلية ---------- */
function wheelSvg(W){
  const R=148,C=170;let s=`<svg viewBox="0 0 340 340" class="gx-rot" id="gxw" style="transform:rotate(${GX.rot}deg)"><defs><radialGradient id="gxg0" cx="50%" cy="50%" r="50%"><stop offset="40%" stop-color="#f5c518"/><stop offset="100%" stop-color="#d89a06"/></radialGradient><linearGradient id="gxg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2bcfe2"/><stop offset="1" stop-color="#17899b"/></linearGradient><linearGradient id="gxg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b6f7e"/><stop offset="1" stop-color="#0f4d59"/></linearGradient><linearGradient id="gxg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d6fe0"/><stop offset="1" stop-color="#5a3fb0"/></linearGradient></defs><circle cx="${C}" cy="${C}" r="166" fill="#0b121b" stroke="#2a4357" stroke-width="3"/>`;
  for(let i=0;i<24;i++){const t=i*15*Math.PI/180;s+=`<circle cx="${C+157*Math.sin(t)}" cy="${C-157*Math.cos(t)}" r="3.4" fill="${i%2?'#f5c518':'#2bcfe2'}"/>`}
  W.forEach((w,i)=>{
    const a=(i*45-22.5)*Math.PI/180,b=(i*45+22.5)*Math.PI/180,p=(r,t)=>`${(C+r*Math.sin(t)).toFixed(2)},${(C-r*Math.cos(t)).toFixed(2)}`;
    const fill=i==0?'url(#gxg0)':w.t=='x'?'#202c39':w.t=='g'?'url(#gxg3)':i%2?'url(#gxg1)':'url(#gxg2)';
    const tc=i==0?'#2a1d00':w.t=='x'?'#8b9bab':'#fff';
    s+=`<path d="M${C},${C}L${p(R,a)}A${R},${R} 0 0 1 ${p(R,b)}Z" fill="${fill}" stroke="#0b121b" stroke-width="3"/><g transform="rotate(${i*45} ${C} ${C})"><text x="${C}" y="62" text-anchor="middle" font-size="${w.l.length>4?15:20}" font-weight="800" fill="${tc}">${ES(w.l)}</text>${w.t=='p'?`<text x="${C}" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="${tc}" opacity=".85">نقطة</text>`:''}</g>`;
  });
  return s+'</svg>';
}
function wheelCard(){
  const c=GX.cfg,W=c?c.wheel:DEFW,cost=c?c.wCost:100,me=GX.me,ms=me?me.stats:null;
  const chips=[...new Set(W.filter(w=>w.t!='x').map(w=>w.t=='g'?'g|1 جوهرة':(W[0]===w?'j|':'p|')+w.l+(w===W[0]?' · الكبرى':'')))].map(x=>{const[k,t]=x.split('|');return`<span class="gx-chip ${k=='j'?'j':k=='g'?'g':''}">${ES(t||'')}</span>`}).join('');
  const wf=me&&me.wfeed&&me.wfeed.length?`<div class="gx-feed">${me.wfeed.slice(0,4).map(x=>`<div><span>${ES(x.n)}</span><em>${ES(x.l)}</em></div>`).join('')}</div>`:'';
  return `<section class="gx-card"><div class="gx-h"><div class="gx-ico">${ic('gem')}</div><div><b>عجلة الحظ</b><small>جوائز فورية تُضاف لرصيدك</small></div></div>
<div class="gx-wbox"><div class="gx-ptr"></div><div class="gx-hub">${ic('gem')}</div>${wheelSvg(W)}</div>
<div class="gx-chips">${chips}</div>
<div class="gx-row"><span>تكلفة الدورة</span><b>${fx(cost)} جوهرة</b></div>
<div class="gx-row"><span>رصيدك من الجواهر</span><b class="cy">${fx(S.gems)} جوهرة</b></div>
<button class="gx-btn" data-a="gxspin" ${GX.spin||!c||!c.wOn?'disabled':''}>${GX.spin?'جارٍ التدوير…':!c?(GX.off?'الخادم غير متاح':'جارٍ الاتصال…'):!c.wOn?'العجلة متوقفة مؤقتاً':'تدوير العجلة · '+fx(cost)+' جوهرة'}</button>
${ms?`<div class="gx-mine"><div><small>دوراتي</small><b>${fx(ms.spins)}</b></div><div><small>جواهر صرفتها</small><b>${fx(ms.wGems)}</b></div><div><small>نقاط ربحتها</small><b class="cy">${fx(ms.wPts)}</b></div></div>`:''}${wf}</section>`;
}
function gameCard(){
  const c=GX.cfg,me=GX.me,ms=me?me.stats:null,seats=c?c.seats:4,w=c?c.waiting:0;
  const seatH=Array.from({length:seats},(_,i)=>`<div class="gx-seat ${i<w?'f':''}">${i<w?ic('user'):'?'}</div>`).join('');
  const fd=me&&me.feed&&me.feed.length?`<div class="gx-feed"><div style="color:var(--mu)"><span>آخر الفائزين</span></div>${me.feed.slice(0,4).map(x=>`<div><span>${ES(x.n)}</span><em>+${fx(x.p)} نقطة</em></div>`).join('')}</div>`:'';
  const net=ms?ms.prizes-ms.staked:0;
  return `<section class="gx-card"><div class="gx-h"><div class="gx-ico">${ic('users')}</div><div><b>العب معنا</b><small>${seats} لاعبين حقيقيين · فائز واحد</small></div>${c?`<div class="gx-live"><i></i>${w?w+' بالانتظار':'متاحة الآن'}</div>`:''}</div>
<div class="gx-seats">${seatH}</div>
${c?`<div class="gx-3"><div><small>المجموع</small><b>${fx(c.pool)}</b></div><div class="win"><small>جائزة الفائز</small><b>${fx(c.prize)}</b></div><div class="cm"><small>عمولة التطبيق ${c.comm}%</small><b>${fx(c.pool-c.prize)}</b></div></div>`:''}
<button class="gx-btn gold" data-a="gxjoin" ${!c||!c.on?'disabled':''}>${!c?(GX.off?'الخادم غير متاح':'جارٍ الاتصال…'):!c.on?'اللعبة متوقفة مؤقتاً':'دخول اللعبة · '+fx(c.entry)+' نقطة'}</button>
<p class="gx-note">تُخصم الرسوم عند الدخول، وتنتظر حتى يكتمل ${seats} لاعبين فعليين. يُحدَّد الفائز عشوائياً من الخادم وتُضاف الجائزة لرصيده مباشرة. إن لم يكتمل العدد تُرجَع رسومك تلقائياً.</p>
${ms?`<div class="gx-mine"><div><small>لعبت</small><b>${fx(ms.games)}</b></div><div><small>فزت</small><b>${fx(ms.won)}</b></div><div><small>الصافي</small><b class="${net>=0?'cy':''}" style="${net<0?'color:#ef5350':''}" dir="ltr">${net>0?'+':''}${fx(net)}</b></div></div>`:''}${fd}</section>`;
}
V.fun=()=>{if(!GX.cfg&&!GX.off||Date.now()-GX.t>6000)load();return hd('التسلية','pad',{l:1})+wheelCard()+gameCard()+nav('fun')};

/* ---------- تطبيق الأرصدة المستحقة (جوائز / استرجاع) ---------- */
async function applyCredits(){
  const a=acct();if(!a||GX.ap||isDemo())return 0;GX.ap=1;
  try{
    const r=await api('/credits?'+qs(a));if(!r||!r.list||!r.list.length)return 0;
    const key='gx:ap:'+a.e,seen=new Set(lsg(key,[])),ids=[];let n=0,tp=0,tg=0,why='';
    for(const c of r.list){
      ids.push(c.id);if(seen.has(c.id))continue;seen.add(c.id);
      lrs(c.r,c.x);
      if(c.p){S.pts+=c.p;tp+=c.p;try{txlog(c.r,c.p,'in')}catch(e){}}
      if(c.g){S.gems+=c.g;tg+=c.g}
      n++;why=c.r;
    }
    lss(key,[...seen].slice(-300));sync();
    await api('/ack','POST',{...a,ids});
    if(n){toast((tp?'أُضيف '+fx(tp)+' نقطة':'')+(tp&&tg?' و':'')+(tg?'أُضيفت '+fx(tg)+' جوهرة':'')+' · '+why);if(!anyOpen()&&!GX.spin)draw()}
    return n;
  }finally{GX.ap=0}
}
/* عمليات لم تكتمل (انقطاع الشبكة بعد الخصم) */
async function recover(){
  const a=acct(),p=lsg('gx:pend',null);if(!a||!p||p.e!=a.e||Date.now()-p.t<20000)return;
  const r=await api('/check?'+qs(a)+'&rid='+encodeURIComponent(p.rid));
  if(!r||r.error)return;
  if(r.ok){lss('gx:pend',null);return}
  lss('gx:pend',null);
  lrs('استرجاع عملية لم تكتمل',p.k=='j'?'رسوم دخول اللعبة':'تكلفة عجلة الحظ');
  if(p.k=='j'){S.pts+=p.amt;try{txlog('استرجاع رسوم دخول اللعبة',p.amt,'in')}catch(e){}}else S.gems+=p.amt;
  sync();toast('تم إرجاع '+fx(p.amt)+(p.k=='j'?' نقطة':' جوهرة')+' لعملية لم تكتمل');if(!anyOpen())draw();
}
async function tick(){
  const a=acct();if(!a||isDemo())return;
  await recover();await applyCredits();
  if(!GX.room&&!GX.busy&&!GX.spin){const m=await api('/me?'+qs(a));if(m&&!m.error){GX.me=m;if(m.room){const r=await api('/room?mid='+m.room+'&'+qs(a));if(r&&r.st&&r.st!='gone'&&r.st!='c')openRoom(r)}}}
}
setInterval(()=>{if(!document.hidden)tick()},20000);
setTimeout(tick,2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
setInterval(()=>{if(S.r=='fun'&&!document.hidden&&!GX.spin&&!anyOpen())load()},6000);

/* ---------- العجلة ---------- */
function popup(html,lose){
  const o=document.createElement('div');o.className='gx-pop';o.innerHTML=`<div class="gx-pb ${lose?'lose':''}">${html}<button class="gx-btn ${lose?'o':'gold'}" style="margin-top:16px" id="gxpc">حسناً</button></div>`;
  document.body.append(o);o.addEventListener('click',e=>{if(e.target==o||e.target.id=='gxpc'){o.remove();draw()}});
}
async function spinWheel(){
  const a=acct();if(!a)return toast('سجّل الدخول أولاً');if(isDemo())return toast('الحساب التجريبي وهمي، لا يمكنه هذا الإجراء');
  const c=GX.cfg;if(!c)return toast('جارٍ الاتصال بالخادم');if(!c.wOn)return toast('العجلة متوقفة مؤقتاً');
  if(GX.spin)return;if(S.gems<c.wCost)return toast('تحتاج '+fx(c.wCost)+' جوهرة للتدوير');
  GX.spin=1;const id=rid();
  lss('gx:pend',{k:'s',rid:id,e:a.e,amt:c.wCost,t:Date.now()});
  lrs('تدوير عجلة الحظ','تكلفة التدوير '+fx(c.wCost)+' جوهرة');S.gems-=c.wCost;sync();draw();
  const r=await api('/wheel/spin','POST',{...a,rid:id,cost:c.wCost});
  if(!r||!r.ok){
    GX.spin=0;
    if(r&&r.error&&!r.net){lss('gx:pend',null);lrs('استرجاع تكلفة العجلة',r.error);S.gems+=c.wCost;sync();toast(r.error)}
    else toast('تعذر تأكيد العملية، سيتم التحقق وإرجاع الجواهر تلقائياً إن لم تكتمل');
    draw();return;
  }
  lss('gx:pend',null);
  const jit=Math.floor(Math.random()*24)-12;
  GX.rot=Math.ceil(GX.rot/360)*360+1800+((360-r.idx*45)%360)+jit;
  const el=q$('#gxw');if(el){void el.getBoundingClientRect();el.style.transform=`rotate(${GX.rot}deg)`}
  setTimeout(()=>{
    GX.spin=0;const p=r.prize;
    if(p.t=='x')popup(`<div class="ic">${ic('gem')}</div><div class="big">حظ أوفر</div><div class="mu">لم تربح في هذه الجولة</div>`,1);
    else popup(`<div class="ic">${ic('gem')}</div><div class="mu">تهانينا!</div><div class="big">${p.t=='g'?'+'+fx(p.v)+' جوهرة':'+'+fx(p.v)+' نقطة'}</div><div class="mu">أُضيفت إلى رصيدك</div>`);
    if(p.t=='x'&&S.acc)ledAdd(S.acc.e,'ev',0,null,'عجلة الحظ: حظ أوفر','لم تربح في هذه الجولة (تكلفتها '+c.wCost+' جوهرة)');
  },4500);
  setTimeout(()=>{applyCredits();load()},(r.wait||4700)+400);
}

/* ---------- اللعبة ---------- */
function closeOv(){GX.room=null;const o=q$('#gx-ov');if(o)o.remove()}
function seatCard(p,i,cls){return `<div class="gx-pl ${p?'':'e'} ${p&&p.me?'me':''} ${cls||''}" data-i="${i}"><div class="gx-av" style="background:${p?COL[i%4]:'#16222e'};${p?'':'color:#42586a'}">${p?ES(ini(p.n)):'؟'}</div><b>${p?ES(p.n)+(p.me?' (أنت)':''):'بانتظار لاعب…'}</b><small>${p?'دخل بـ'+fx(GX.room?GX.room.entry:0)+' نقطة':'&nbsp;'}</small></div>`}
function openRoom(r){
  closeOv();
  const ov=document.createElement('div');ov.id='gx-ov';ov.className='gx-ov';document.body.append(ov);
  GX.room={id:r.id,entry:r.entry,stop:0,anim:0,dl:Date.now()+r.left,total:Math.max(1,r.left)};
  paint(r);loop();
}
async function loop(){
  const R=GX.room;if(!R||R.stop)return;const a=acct();
  const r=await api('/room?mid='+R.id+'&'+qs(a));
  if(!GX.room||GX.room!==R)return;
  if(r&&!r.error)paint(r);
  if(r&&r.st=='w'||!r||r.error){setTimeout(loop,1200);return}
}
function paint(r){
  const R=GX.room,ov=q$('#gx-ov');if(!R||!ov)return;
  if(r.st=='w'){
    R.entry=r.entry;R.dl=Date.now()+r.left;
    const seats=Array.from({length:r.seats},(_,i)=>r.players[i]||null),total=r.entry*r.seats,pz=Math.floor(total*(100-r.pct)/100);
    ov.innerHTML=`<h2>بانتظار اللاعبين…</h2><p class="sub">${r.players.length} من ${r.seats} لاعبين</p><div class="gx-grid">${seats.map((p,i)=>seatCard(p,i)).join('')}</div>
<div class="gx-bar"><i id="gxb" style="width:100%"></i></div><p class="sub" style="margin:0 0 10px">الوقت المتبقي <b id="gxt" class="cy">${Math.ceil(r.left/1000)}</b> ثانية، وإن لم يكتمل العدد تُرجَع رسومك</p>
<div class="gx-res"><div class="gx-sum"><div class="gx-row" style="border:0"><span>المجموع</span><b>${fx(total)}</b></div><div class="gx-row"><span>جائزة الفائز</span><b style="color:#f5c518">${fx(pz)}</b></div><div class="gx-row"><span>عمولة التطبيق (${r.pct}%)</span><b>${fx(total-pz)}</b></div></div>
<button class="gx-btn o" id="gxlv">مغادرة واسترجاع الرسوم</button></div>`;
    clearInterval(R.ti);R.ti=setInterval(()=>{if(GX.room!==R){clearInterval(R.ti);return}const l=Math.max(0,R.dl-Date.now()),t=q$('#gxt'),b=q$('#gxb');if(t)t.textContent=Math.ceil(l/1000);if(b)b.style.width=Math.min(100,l/R.total*100)+'%'},250);
    q$('#gxlv').onclick=async()=>{const a=acct(),x=await api('/leave','POST',{...a,mid:R.id});if(x&&x.ok){clearInterval(R.ti);closeOv();await applyCredits();draw()}else toast((x&&x.error)||'تعذرت المغادرة')};
  }else if(r.st=='d'&&!R.anim){R.anim=1;clearInterval(R.ti);reveal(r)}
  else if(r.st=='c'){
    clearInterval(R.ti);R.stop=1;
    ov.innerHTML=`<h2>لم تكتمل اللعبة</h2><p class="sub">${ES(r.why||'لم يكتمل عدد اللاعبين')}</p><div class="gx-res"><div class="big cy">تم إرجاع ${fx(r.entry)} نقطة</div><button class="gx-btn" id="gxcl" style="margin-top:14px">إغلاق</button></div>`;
    applyCredits();q$('#gxcl').onclick=()=>{closeOv();draw()};
  }else if(r.st=='gone'){clearInterval(R.ti);closeOv();applyCredits();draw()}
}
function reveal(r){
  const R=GX.room,ov=q$('#gx-ov'),n=r.players.length,w=r.win,mine=r.players.findIndex(p=>p.me),iWin=mine==w;
  ov.innerHTML=`<h2>اللعبة جارية…</h2><p class="sub">المجموع ${fx(r.total)} · الفائز ${fx(r.prize)} · عمولة التطبيق ${fx(r.cm)}</p><div class="gx-grid">${r.players.map((p,i)=>seatCard(p,i)).join('')}</div><div class="gx-res" id="gxr"></div>`;
  const cards=ov.querySelectorAll('.gx-pl');
  const fin=()=>{
    cards.forEach((c,i)=>{c.classList.remove('on');c.classList.add(i==w?'win':'lose')});
    ov.querySelector('h2').textContent=iWin?'🎉 مبروك! أنت الفائز':'انتهت اللعبة';
    q$('#gxr').innerHTML=`<div class="big ${iWin?'win':'cy'}">${iWin?'ربحت '+fx(r.prize)+' نقطة':'الفائز: '+ES(r.players[w].n)}</div>${iWin?'':`<div class="mu">جائزة الفائز ${fx(r.prize)} نقطة</div>`}
<div class="gx-sum"><div class="gx-row" style="border:0"><span>المجموع</span><b>${fx(r.total)}</b></div><div class="gx-row"><span>جائزة الفائز</span><b style="color:#f5c518">${fx(r.prize)}</b></div><div class="gx-row"><span>عمولة التطبيق</span><b>${fx(r.cm)}</b></div></div>
<div class="mu" id="gxm" style="margin-bottom:8px">${iWin?'جارٍ إضافة الجائزة إلى رصيدك…':'رسوم دخولك '+fx(r.entry)+' نقطة'}</div><button class="gx-btn" id="gxcl">إغلاق</button>`;
    q$('#gxcl').onclick=()=>{closeOv();draw()};
    if(!iWin&&S.acc)ledAdd(S.acc.e,'ev',0,null,'خسارة في لعبة العب معنا','الفائز: '+r.players[w].n+' · رسوم دخولك '+fx(r.entry)+' نقطة');
    if(iWin){let t=0;const tryApply=async()=>{const k=await applyCredits(),m=q$('#gxm');if(k){if(m)m.textContent='✅ أُضيفت الجائزة إلى رصيدك';return}if(++t<8)setTimeout(tryApply,1500);else if(m)m.textContent='ستُضاف الجائزة إلى رصيدك خلال لحظات'};setTimeout(tryApply,1500)}
  };
  if(r.rev<1800){fin();return}
  const N=18+((w-(17%n)+n)%n),tot=Math.min(5600,r.rev-900),ws=Array.from({length:N},(_,k)=>1+3*Math.pow(k/N,2)),sw=ws.reduce((a,b)=>a+b,0);let k=0;
  const step=()=>{if(!GX.room||GX.room!==R)return;cards.forEach((c,i)=>c.classList.toggle('on',i==k%n));if(k<N-1){const d=ws[k]/sw*tot;k++;setTimeout(step,Math.max(50,d))}else fin()};
  k=0;step();
}
async function joinGame(){
  const a=acct();if(!a)return toast('سجّل الدخول أولاً');if(isDemo())return toast('الحساب التجريبي وهمي، لا يمكنه هذا الإجراء');
  const c=GX.cfg;if(!c)return toast('جارٍ الاتصال بالخادم');if(!c.on)return toast('اللعبة متوقفة مؤقتاً');
  if(GX.busy||GX.room)return;if(S.pts<c.entry)return toast('رصيد النقاط غير كافٍ');
  GX.busy=1;const id=rid();
  lss('gx:pend',{k:'j',rid:id,e:a.e,amt:c.entry,t:Date.now()});
  lrs('دخول لعبة العب معنا','رسوم الدخول '+fx(c.entry)+' نقطة');S.pts-=c.entry;try{txlog('دخول لعبة العب معنا',c.entry,'out')}catch(e){}sync();
  const r=await api('/join','POST',{...a,rid:id,entry:c.entry});
  GX.busy=0;
  if(r&&r.ok){lss('gx:pend',null);if(r.room)openRoom(r.room);else{await applyCredits();draw()}return}
  if(r&&r.error&&!r.net){lss('gx:pend',null);lrs('استرجاع رسوم الدخول',r.error);S.pts+=c.entry;try{txlog('استرجاع رسوم الدخول',c.entry,'in')}catch(e){}sync();toast(r.error);load();draw();return}
  toast('تعذر تأكيد الدخول، سيتم التحقق وإرجاع الرسوم تلقائياً إن لم تكتمل');draw();
}
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-a="gxspin"],[data-a="gxjoin"]');if(!b)return;
  e.stopImmediatePropagation();e.preventDefault();
  if(b.dataset.a=='gxspin')spinWheel();else joinGame();
},true);
