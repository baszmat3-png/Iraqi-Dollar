function normPhone(raw){
  let s=String(raw||'').replace(/[\s\-()]/g,'');
  if(s.startsWith('00'))s='+'+s.slice(2);
  else if(s.startsWith('07'))s='+964'+s.slice(1);
  else if(s.startsWith('7')&&s.length===10)s='+964'+s;
  else if(s.startsWith('964'))s='+'+s;
  else if(!s.startsWith('+')&&s.length>=10)s='+'+s;
  return s;
}

async function syncBackendState(){
  const token=localStorage.getItem('token');
  if(!token)return;
  try{
    const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+token}});
    if(r.ok){
      const d=await r.json();
      S.pts=d.pts;S.gems=d.gems;S.usd=d.usd;S.name=d.name;S.mail=d.email;S.phone=d.phone;
      if(d.counter){
        S.run=d.counter.running?1:0;S.done=d.counter.done?1:0;
        S.left=d.counter.left;S.accr=d.counter.accr;S.accg=d.counter.accg;
      }
      save();draw();
    }else if(r.status===401){
      clearSes();
    }
  }catch(e){console.warn('Sync state offline fallback',e.message);}
}

async function doLogin(){
  const e=$('#le').value.trim().toLowerCase(),w=$('#lp').value;
  if(DEMO_LOGIN&&e==DA.e&&w==DA.pw){load({e:DA.e,n:DA.n,p:DA.p});return enter()}
  if(!EM.test(e))return er('اكتب بريداً إلكترونياً صحيحاً');
  if(!w)return er('اكتب كلمة المرور');
  debtGuard(e);
  const btn=document.querySelector('[data-a="dologin"]');
  const oldText=btn?btn.innerHTML:'';
  if(btn){btn.disabled=true;btn.innerHTML='جارٍ تسجيل الدخول…';}
  try{
    const r=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:e,password:w})
    });
    const d=await r.json();
    if(!r.ok){
      if(btn){btn.disabled=false;btn.innerHTML=oldText;}
      return er(d.error||'البريد أو كلمة المرور غير صحيحة');
    }
    if(d.token)localStorage.setItem('token',d.token);
    load(d.user);
    await syncBackendState();
    enter();
  }catch(err){
    if(btn){btn.disabled=false;btn.innerHTML=oldText;}
    const a=AC.get()[e];
    if(a&&a.h===await hp(w)){load(a);enter();return}
    er('تعذر الاتصال بالخادم، تحقق من الاتصال بالإنترنت');
  }
}

async function doSign(){
  const n=$('#rn').value.trim().replace(/\s+/g,' ');
  const e=$('#re').value.trim().toLowerCase();
  let p=normPhone($('#rp').value);
  const w=$('#rw1').value,w2=$('#rw2').value;

  if(!n||n.split(' ').length<2)return er('اكتب اسمك الثنائي أو الثلاثي');
  if(!EM.test(e))return er('اكتب بريداً إلكترونياً صحيحاً');
  if(!PH.test(p))return er('رقم واتساب غير صحيح، اكتبه مثل 07xxxxxxxxx أو +9647xxxxxxxxx');
  if(w.length<6)return er('كلمة المرور 6 أحرف على الأقل');
  if(w!==w2)return er('كلمتا المرور غير متطابقتين');
  
  const btn=document.querySelector('[data-a="dosign"]');
  const oldText=btn?btn.innerHTML:'';
  if(btn){btn.disabled=true;btn.innerHTML='جارٍ إرسال رمز التحقق…';}

  const ctrl=new AbortController();
  const slowTimer=setTimeout(()=>{
    if(btn&&btn.disabled)btn.innerHTML='جارٍ انتظار استجابة الخادم…';
  },3500);
  const killTimer=setTimeout(()=>ctrl.abort(),18000);

  try{
    const r=await fetch('/api/auth/signup/request',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:n,email:e,phone:p,password:w}),
      signal:ctrl.signal
    });
    clearTimeout(slowTimer);
    clearTimeout(killTimer);
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      if(btn){btn.disabled=false;btn.innerHTML=oldText;}
      return er(d.error||'تعذر إرسال رمز التحقق');
    }
    S.otp={p:'signup',ph:p,pl:{e,p,n,w},back:'signup',exp:Date.now()+3e5,t:0,rs:Date.now()+6e4,st:1,dsp:p};
    go('otp');
    toast('تم إرسال رمز التحقق بنجاح إلى واتساب');
  }catch(err){
    clearTimeout(slowTimer);
    clearTimeout(killTimer);
    if(btn){btn.disabled=false;btn.innerHTML=oldText;}
    if(err.name==='AbortError'){
      er('استغرق الخادم وقتاً أطول من المتوقع، يرجى إعادة المحاولة.');
    }else{
      er('تعذر الاتصال بالخادم لإرسال رمز التحقق، يرجى المحاولة ثانية.');
    }
  }
}

async function finishOtp(o){
  const c=($('#oc').value||'').trim();
  if(!c||c.length<6)return toast('أدخل رمز التحقق المكون من 6 أرقام');
  const btn=document.querySelector('[data-a="vo"]');
  const oldText=btn?btn.innerHTML:'';
  if(btn){btn.disabled=true;btn.innerHTML='جارٍ التأكيد…';}

  if(o.p=='signup'){
    try{
      const r=await fetch('/api/auth/signup/verify',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({phone:o.ph,email:o.pl.e,code:c})
      });
      const d=await r.json();
      if(!r.ok){
        if(btn){btn.disabled=false;btn.innerHTML=oldText;}
        return toast(d.error||'رمز التحقق غير صحيح');
      }
      if(d.token)localStorage.setItem('token',d.token);
      S.otp=null;
      const m=AC.get();
      m[o.pl.e]={e:o.pl.e,p:o.pl.p,n:o.pl.n,h:await hp(o.pl.w),c:Date.now()};
      AC.set(m);
      load(d.user||m[o.pl.e]);
      saveSes();
      await syncBackendState();
      go('ref');
      return dlg(`<h2 style="text-align:center;margin-top:0;color:#3ddc68">تم إنشاء حسابك بنجاح ✓</h2><p class="mu" style="text-align:center">مرحباً ${esc(o.pl.n)}، تم تأكيد حسابك وتفعيله بنجاح.</p><button class="btn" onclick="d.close()">متابعة</button>`);
    }catch(err){
      if(btn){btn.disabled=false;btn.innerHTML=oldText;}
      return toast('تعذر التحقق من الرمز عبر الخادم');
    }
  }

  if(o.p=='reset'){
    S.otp=null;
    S.rs={e:o.pl.e,x:Date.now()+6e5};
    return go('resetpw');
  }

  if(o.p=='ph'){S.phone=o.pl.v;S.v.ph=1}else{S.mail=o.pl.v;S.v.ml=1}
  persist();toast('تم التوثيق بنجاح');go('profile');
}

async function sendOtp(p,ph,pl,back){
  const btn=document.querySelector('#rs');
  if(btn)btn.disabled=true;
  const ctrl=new AbortController();
  const killTimer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const r=await fetch('/api/auth/signup/request',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone:ph,email:pl.e||'',purpose:p,payload:pl}),
      signal:ctrl.signal
    });
    clearTimeout(killTimer);
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      if(btn)btn.disabled=false;
      return toast(d.error||'تعذر إرسال الرمز');
    }
    S.otp={p,ph,pl,back,exp:Date.now()+3e5,t:0,rs:Date.now()+6e4,st:1,dsp:p=='reset'?ph.slice(0,4)+'••••'+ph.slice(-3):ph};
    go('otp');
    toast('تم إرسال رمز التحقق عبر واتساب');
  }catch(e){
    clearTimeout(killTimer);
    if(btn)btn.disabled=false;
    toast('تعذر الاتصال بالخادم لإرسال الرمز، يرجى إعادة المحاولة');
  }
}
