async function applyCredits(){
  const a=acct();if(!a||GX.ap||isDemo())return 0;GX.ap=1;
  try{
    const r=await api('/credits?'+qs(a));if(!r||!r.list||!r.list.length)return 0;
    const key='gx:ap:'+a.e,seen=new Set(lsg(key,[])),ids=[];let n=0,tp=0,tg=0,why='';
    for(const c of r.list){
      ids.push(c.id);if(seen.has(c.id))continue;seen.add(c.id);
      lrs(c.r,c.x);
      if(c.p){S.pts+=c.p;tp+=c.p;try{txlog(c.r,c.p,'in')}catch(e){}}
      if(c.g){S.gems+=c.g;tg+=c.g}
      n++;why=c.r;
    }
    lss(key,[...seen].slice(-300));sync();
    await api('/ack','POST',{...a,ids});
    if(n){toast((tp?'أُضيف '+fx(tp)+' نقطة':'')+(tp&&tg?' و':'')+(tg?'أُضيفت '+fx(tg)+' جوهرة':'')+' · '+why);if(!anyOpen()&&!GX.spin)draw()}
    return n;
  }finally{GX.ap=0}
}

}

async function spinWheel(){
  const a=acct();if(!a)return toast('سجّل الدخول أولاً');if(isDemo())return toast('الحساب التجريبي وهمي، لا يمكنه هذا الإجراء');
  const c=GX.cfg;if(!c)return toast('جارٍ الاتصال بالخادم');if(!c.wOn)return toast('العجلة متوقفة مؤقتاً');
  if(GX.spin)return;if(S.gems<c.wCost)return toast('تحتاج '+fx(c.wCost)+' جوهرة للتدوير');
  GX.spin=1;const id=rid();
  lss('gx:pend',{k:'s',rid:id,e:a.e,amt:c.wCost,t:Date.now()});
  lrs('تدوير عجلة الحظ','تكلفة التدوير '+fx(c.wCost)+' جوهرة');S.gems-=c.wCost;sync();draw();
  const r=await api('/wheel/spin','POST',{...a,rid:id,cost:c.wCost});
  if(!r||!r.ok){
    GX.spin=0;
    if(r&&r.error&&!r.net){lss('gx:pend',null);lrs('استرجاع تكلفة العجلة',r.error);S.gems+=c.wCost;sync();toast(r.error)}
    else toast('تعذر تأكيد العملية، سيتم التحقق وإرجاع الجواهر تلقائياً إن لم تكتمل');
    draw();return;
  }
  lss('gx:pend',null);
  const jit=Math.floor(Math.random()*24)-12;
  GX.rot=Math.ceil(GX.rot/360)*360+1800+((360-r.idx*45)%360)+jit;
  const el=q$('#gxw');if(el){void el.getBoundingClientRect();el.style.transform=`rotate(${GX.rot}deg)`}
  setTimeout(()=>{
    GX.spin=0;const p=r.prize;
    if(p.t=='x')popup(`<div class="ic">${ic('gem')}</div><div class="big">حظ أوفر</div><div class="mu">لم تربح في هذه الجولة</div>`,1);
    else popup(`<div class="ic">${ic('gem')}</div><div class="mu">تهانينا!</div><div class="big">${p.t=='g'?'+'+fx(p.v)+' جوهرة':'+'+fx(p.v)+' نقطة'}</div><div class="mu">أُضيفت إلى رصيدك</div>`);
    if(p.t=='x'&&S.acc)ledAdd(S.acc.e,'ev',0,null,'عجلة الحظ: حظ أوفر','لم تربح في هذه الجولة (تكلفتها '+c.wCost+' جوهرة)');
  },4500);
  setTimeout(()=>{applyCredits();load()},(r.wait||4700)+400);
}

function openRoom(r){
  closeOv();

  GX.room={id:r.id,entry:r.entry,stop:0,anim:0,dl:Date.now()+r.left,total:Math.max(1,r.left)};

async function loop(){

}
function paint(r){
  const R=GX.room,ov=q$('#gx-ov');if(!R||!ov)return;

<div class="gx-bar"><i id="gxb" style="width:100%"></i></div><p class="sub" style="margin:0 0 10px">الوقت المتبقي <b id="gxt" class="cy">${Math.ceil(r.left/1000)}</b> ثانية، وإن لم يكتمل العدد تُرجَع رسومك</p>
<div class="gx-res"><div class="gx-sum"><div class="gx-row" style="border:0"><span>المجموع</span><b>${fx(total)}</b></div><div class="gx-row"><span>جائزة الفائز</span><b style="color:#f5c518">${fx(pz)}</b></div><div class="gx-row"><span>عمولة التطبيق (${r.pct}%)</span><b>${fx(total-pz)}</b></div></div>
<button class="gx-btn o" id="gxlv">مغادرة واسترجاع الرسوم</button></div>`;
    clearInterval(R.ti);R.ti=setInterval(()=>{if(GX.room!==R){clearInterval(R.ti);return}const l=Math.max(0,R.dl-Date.now()),t=q$('#gxt'),b=q$('#gxb');if(t)t.textContent=Math.ceil(l/1000);if(b)b.style.width=Math.min(100,l/R.total*100)+'%'},250);
    q$('#gxlv').onclick=async()=>{const a=acct(),x=await api('/leave','POST',{...a,mid:R.id});if(x&&x.ok){clearInterval(R.ti);closeOv();await applyCredits();draw()}else toast((x&&x.error)||'تعذرت المغادرة')};

function reveal(r){
  const R=GX.room,ov=q$('#gx-ov'),n=r.players.length,w=r.win,mine=r.players.findIndex(p=>p.me),iWin=mine==w;
  ov.innerHTML=`<h2>اللعبة جارية…</h2><p class="sub">المجموع ${fx(r.total)} · الفائز ${fx(r.prize)} · عمولة التطبيق ${fx(r.cm)}</p><div class="gx-grid">${r.players.map((p,i)=>seatCard(p,i)).join('')}</div><div class="gx-res" id="gxr"></div>`;

    cards.forEach((c,i)=>{c.classList.remove('on');c.classList.add(i==w?'win':'lose')});

<div class="mu" id="gxm" style="margin-bottom:8px">${iWin?'جارٍ إضافة الجائزة إلى رصيدك…':'رسوم دخولك '+fx(r.entry)+' نقطة'}</div><button class="gx-btn" id="gxcl">إغلاق</button>`;
    q$('#gxcl').onclick=()=>{closeOv();draw()};
    if(!iWin&&S.acc)ledAdd(S.acc.e,'ev',0,null,'خسارة في لعبة العب معنا','الفائز: '+r.players[w].n+' · رسوم دخولك '+fx(r.entry)+' نقطة');

  };

async function joinGame(){

  const c=GX.cfg;if(!c)return toast('جارٍ الاتصال بالخادم');if(!c.on)return toast('اللعبة متوقفة مؤقتاً');
  if(GX.busy||GX.room)return;if(S.pts<c.entry)return toast('رصيد النقاط غير كافٍ');
  GX.busy=1;const id=rid();
  lss('gx:pend',{k:'j',rid:id,e:a.e,amt:c.entry,t:Date.now()});
  lrs('دخول لعبة العب معنا','رسوم الدخول '+fx(c.entry)+' نقطة');S.pts-=c.entry;try{txlog('دخول لعبة العب معنا',c.entry,'out')}catch(e){}sync();

<div class="c" style="grid-column:1/-1"><h3>الحصيلة اليومية (${n} يوم)</h3>${tbl(['اليوم','جولات','رهانات','جوائز','عمولة','دورات العجلة','جواهر','جوائز العجلة','صافي الربح'],[...S2].reverse().map((x,i)=>`<tr><td dir="ltr">${x.d.slice(5)}</td><td>${f(x.g.n)}</td><td>${f(x.g.stake)}</td><td>${f(x.g.prize)}</td><td class="up">${f(x.g.comm)}</td><td>${f(x.w.n)}</td><td>${f(x.w.gems)}</td><td>${f(x.w.pts)}${x.w.gout?' +'+f(x.w.gout)+'ج':''}</td><td>${sgn(dnet(x))}</td></tr>`).concat([`<tr style="font-weight:700;background:#0b1620"><td>المجموع</td><td>${f(sum.gn)}</td><td>${f(sum.st)}</td><td>${f(sum.pz)}</td><td class="up">${f(sum.cm)}</td><td>${f(sum.wn)}</td><td>${f(sum.wg)}</td><td>${f(sum.wp)}${sum.wo?' +'+f(sum.wo)+'ج':''}</td><td>${sgn(sum.cm+(sum.wg-sum.wo)*R-sum.wp)}</td></tr>`]))}</div>
<div class="c" style="grid-column:1/-1"><h3>كشف حساب اللاعبين — اللعبتان</h3>${lgTbl}</div>
<div class="c" style="grid-column:1/-1"><h3>آخر الجولات</h3>${tbl(['الوقت','اللاعبون','الفائز','المجموع','الجائزة','العمولة'],d.matches.map(m=>`<tr><td class="mu">${ago(m.t)}</td><td style="max-width:240px;white-space:normal">${m.ps.map(esc).join('، ')}</td><td><b>${esc(m.win)}</b></td><td>${f(m.total)}</td><td>${f(m.prize)}</td><td class="up">${f(m.cm)}</td></tr>`),'لا توجد جولات بعد')}</div>
<div class="c" style="grid-column:1/-1"><h3>آخر دورات العجلة</h3>${tbl(['الوقت','اللاعب','التكلفة','النتيجة'],d.spins.map(s=>`<tr><td class="mu">${ago(s.t)}</td><td>${esc(s.n)}</td><td>${f(s.cost)} جوهرة</td><td>${s.pr.t=='x'?'<span class="bx b">حظ أوفر</span>':s.pr.t=='g'?'<span class="bx i">'+f(s.pr.v)+' جوهرة</span>':'<span class="bx a">'+f(s.pr.v)+' نقطة</span>'}</td></tr>`),'لا توجد دورات بعد')}</div>
<div class="c" style="grid-column:1/-1"><h3>إعدادات الألعاب</h3>
<div class="rw l" style="margin-bottom:8px"><label class="rw l" style="gap:6px"><input type="checkbox" id="gc_on" ${c.on?'checked':''}> لعبة العب معنا مفعّلة</label><label class="rw l" style="gap:6px"><input type="checkbox" id="gc_won" ${c.wOn?'checked':''}> العجلة مفعّلة</label></div>
<div class="gd k">${inp('gc_entry','رسوم الدخول (نقطة)',c.entry)}${inp('gc_comm','عمولة التطبيق %',c.comm)}${inp('gc_wait','مهلة انتظار اللاعبين (ثانية)',c.wait)}${inp('gc_wcost','تكلفة العجلة (جوهرة)',c.wCost)}${inp('gc_jack','الجائزة الكبرى (نقطة)',c.jack)}${inp('gc_wj','نسبة الكبرى %',c.wJack)}${inp('gc_wl','نسبة حظ أوفر %',c.wLose)}${inp('gc_rate','نقاط لكل جوهرة (للحساب)',c.gemRate)}</div>
<div class="mu" style="font-size:.8rem;margin:8px 0">الفائز بالعجلة تُحدَّده الخادم عشوائياً. متوسط الجائزة النظري لكل دورة ≈ <b>${f(ev)}</b> نقطة مقابل تكلفة <b>${f(evCost)}</b> نقطة (هامش ربح نظري ${margin.toFixed(1)}%). تغيير الرسوم أو العمولة يُلغي غرف الانتظار المفتوحة ويُرجع الرسوم.</div>
<button class="btn" data-a="gxsave">حفظ الإعدادات</button></div>
<div class="c"><h3>فك ربط جهاز لاعب</h3><div class="mu" style="font-size:.8rem;margin-bottom:6px">إذا غيّر لاعب جهازه أو مسح بيانات المتصفح ولم يعد يستلم جوائزه.</div><input id="gc_ub" dir="ltr" placeholder="بريد اللاعب"><button class="btn o" data-a="gxunb" style="margin-top:6px">فك الربط</button></div>
<div class="c"><h3>ملاحظة</h3><div class="mu" style="font-size:.82rem;line-height:1.8">أرصدة اللاعبين الحالية محفوظة على أجهزتهم. الخادم يحسم النتيجة ويسجّل كل رهان وجائزة وعمولة، وتُضاف الجوائز للاعب مرة واحدة فقط. جوائز لم تُستلم بعد: <b>${f(d.pending)}</b> نقطة.</div></div></div>`);
};
document.addEventListener('click',async e=>{
  const b=e.target.closest&&e.target.closest('[data-a="gxref"],[data-a="gxsave"],[data-a="gxunb"]');if(!b)return;
  e.stopImmediatePropagation();e.preventDefault();const a=b.dataset.a;
  if(a=='gxref'){GA.err='';await gaLoad(true);toast('تم التحديث');return}
  if(!can('cfg'))return toast('لا تملك صلاحية هذا الإجراء');
  if(a=='gxsave'){
    const v=id=>+(q$('#'+id)||{}).value,body={on:q$('#gc_on').checked,wOn:q$('#gc_won').checked,entry:v('gc_entry'),comm:v('gc_comm'),wait:v('gc_wait'),wCost:v('gc_wcost'),jack:v('gc_jack'),wJack:v('gc_wj'),wLose:v('gc_wl'),gemRate:v('gc_rate')};
    if(Object.values(body).some(x=>typeof x=='number'&&!isFinite(x)))return toast('قيم غير صحيحة');
    if(body.wJack+body.wLose>100)return toast('مجموع نسبتي الكبرى وحظ أوفر يتجاوز 100%');
    const j=await ctlApi('/game/config','POST',body);if(j){try{alog('تعديل إعدادات الألعاب')}catch(x){}toast('تم حفظ الإعدادات');await gaLoad(true)}
  }
  if(a=='gxunb'){const em=((q$('#gc_ub')||{}).value||'').trim().toLowerCase();if(!em)return toast('اكتب البريد');const j=await ctlApi('/game/unbind','POST',{e:em});if(j)toast('تم فك الربط، سيرتبط بأول جهاز يدخل')}
},true);
}
})();
