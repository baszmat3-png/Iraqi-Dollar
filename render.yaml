services:
  - type: web
    name: iraqi-dollar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: iraqi-dollar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GMAIL
        sync: false
      - key: APP_PASS
        sync: false
      - key: WPSENDER_API_KEY
        value: wps_7b5db2a829ff4377ad0c6c42ea7fe4af991c191992305e70eab136c8bb89f7d2
      - key: WPSENDER_API_URL
        value: https://backendapi.wpsenderx.com/api/messages/send
      - key: WA_API_KEY
        value: wps_7b5db2a829ff4377ad0c6c42ea7fe4af991c191992305e70eab136c8bb89f7d2
      - key: WA_API_URL
        value: https://backendapi.wpsenderx.com/api/messages/send
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: iraqi-dollar-db
    databaseName: iraqi_dollar
    user: iraqi_dollar
    plan: free
