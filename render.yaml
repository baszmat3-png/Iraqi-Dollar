services:
  - type: web
    name: iraqi-dollar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: iraqi-dollar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WA_API_KEY
        sync: false
      - key: WA_API_URL
        value: https://backendapi.wpsenderx.com/api/messages/send

databases:
  - name: iraqi-dollar-db
    databaseName: iraqi_dollar
    user: iraqi_dollar
    plan: free
